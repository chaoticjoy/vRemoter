name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos-build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build & Run Self-Tests
        run: |
          swift build --disable-sandbox
          .build/debug/vRemote --voice-session-self-test
          Scripts/run-self-tests.sh

      - name: Build App Bundle & DMG
        run: |
          Scripts/build-dmg.sh

  windows-build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Test Core
        run: |
          dotnet test Windows/vRemoter.sln -c Release

      - name: Publish Windows App
        shell: pwsh
        run: |
          $out = dotnet publish Windows/src/vRemoter.Windows/vRemoter.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o Windows/dist/publish 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $out | Where-Object { $_ -match 'error |warning |NETSDK|MSB|IL\d+' } | Select-Object -First 10 | ForEach-Object {
              Write-Host "::error::$_"
            }
            exit $code
          }
