name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build & publish'
        type: choice
        required: true
        default: 'all'
        options:
          - windows
          - all
          - macos
      tag:
        description: 'Release tag (e.g. v1.4.0); defaults to v<VERSION>'
        required: false

permissions:
  contents: write

env:
  UPSTREAM_PKG_URL: https://github.com/ccc333cn/vRemoter/releases/download/v1.3.2/vRemoter-Community-1.3.2-AppleSilicon.pkg
  UPSTREAM_PKG_SHA256: a86115de7f9a1fcc262f51dd494b80a5f660661c1d01afc6b6ad5ba488e09445

jobs:
  resolve-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      run_macos: ${{ steps.meta.outputs.run_macos }}
      run_windows: ${{ steps.meta.outputs.run_windows }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Version, Tag & Ensure Release Exists
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          if [[ "${{ github.event_name }}" == "push" ]]; then
            RUN_MAC="true"
            RUN_WIN="true"
          else
            PLAT="${{ github.event.inputs.platforms }}"
            [[ "$PLAT" == "all" || "$PLAT" == "macos" ]] && RUN_MAC="true" || RUN_MAC="false"
            [[ "$PLAT" == "all" || "$PLAT" == "windows" ]] && RUN_WIN="true" || RUN_WIN="false"
          fi

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "vRemoter ${VERSION}" \
              --generate-notes
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "run_macos=${RUN_MAC}" >> "$GITHUB_OUTPUT"
          echo "run_windows=${RUN_WIN}" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-meta
    if: needs.resolve-meta.outputs.run_macos == 'true'
    runs-on: macos-15
    outputs:
      pkg_sha: ${{ steps.pkg.outputs.pkg_sha }}
      dmg_sha: ${{ steps.pkg.outputs.dmg_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Self-Tests
        run: |
          swift build --disable-sandbox
          .build/debug/vRemote --voice-session-self-test
          Scripts/run-self-tests.sh

      - name: Prepare vRemoteDriver.driver from Upstream v1.3.2 PKG
        run: |
          curl -fsSL "$UPSTREAM_PKG_URL" -o /tmp/upstream.pkg
          echo "$UPSTREAM_PKG_SHA256  /tmp/upstream.pkg" | shasum -a 256 -c -
          rm -rf /tmp/upstream-expanded
          pkgutil --expand-full /tmp/upstream.pkg /tmp/upstream-expanded
          test -d "/tmp/upstream-expanded/Payload/Library/Audio/Plug-Ins/HAL/vRemoteDriver.driver"

      - name: Build & Upload macOS Release Assets Directly
        id: pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.resolve-meta.outputs.version }}"
          TAG="${{ needs.resolve-meta.outputs.tag }}"
          export VREMOTER_DRIVER="/tmp/upstream-expanded/Payload/Library/Audio/Plug-Ins/HAL/vRemoteDriver.driver"
          Scripts/build-pkg.sh
          Scripts/build-dmg.sh

          PKG_OUT="dist/vRemoter-Community-${VERSION}-AppleSilicon.pkg"
          DMG_OUT="dist/vRemoter-Community-${VERSION}-AppleSilicon.dmg"
          cp "dist/vRemoter-${VERSION}.pkg" "$PKG_OUT"
          cp "dist/vRemoter-${VERSION}.dmg" "$DMG_OUT"

          echo "pkg_sha=$(shasum -a 256 "$PKG_OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "dmg_sha=$(shasum -a 256 "$DMG_OUT" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          gh release upload "$TAG" "$PKG_OUT" "$DMG_OUT" --repo "${{ github.repository }}" --clobber

  build-windows:
    needs: resolve-meta
    if: needs.resolve-meta.outputs.run_windows == 'true'
    runs-on: windows-latest
    outputs:
      exe_sha: ${{ steps.winpkg.outputs.exe_sha }}
      zip_sha: ${{ steps.winpkg.outputs.zip_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Windows Core Tests
        run: dotnet test Windows/vRemoter.sln -c Release

      - name: Publish Single-File, Build Installer & Upload Release Assets Directly
        id: winpkg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ needs.resolve-meta.outputs.version }}"
          $tag = "${{ needs.resolve-meta.outputs.tag }}"
          dotnet publish Windows/src/vRemoter.Windows/vRemoter.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$ver -o Windows/dist/publish

          $zipOut = "Windows/dist/vRemoter-Community-$ver-Windows-x64-Portable.zip"
          Compress-Archive -Path "Windows/dist/publish/*" -DestinationPath $zipOut -Force

          iscc "/DMyAppVersion=$ver" Windows/Installer/vRemoter.iss
          $exeOut = "Windows/dist/vRemoter-Community-$ver-Windows-x64-Setup.exe"

          $exeSha = (Get-FileHash $exeOut -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSha = (Get-FileHash $zipOut -Algorithm SHA256).Hash.ToLowerInvariant()
          echo "exe_sha=$exeSha" >> $env:GITHUB_OUTPUT
          echo "zip_sha=$zipSha" >> $env:GITHUB_OUTPUT

          gh release upload $tag $exeOut $zipOut --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: [resolve-meta, build-macos, build-windows]
    if: |
      always() &&
      !cancelled() &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
      (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Update Release Notes & SHA-256 Checksums
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve-meta.outputs.version }}
          TAG: ${{ needs.resolve-meta.outputs.tag }}
          MAC_BUILT: ${{ needs.build-macos.result == 'success' }}
          WIN_BUILT: ${{ needs.build-windows.result == 'success' }}
          PKG_SHA: ${{ needs.build-macos.outputs.pkg_sha }}
          DMG_SHA: ${{ needs.build-macos.outputs.dmg_sha }}
          EXE_SHA: ${{ needs.build-windows.outputs.exe_sha }}
          ZIP_SHA: ${{ needs.build-windows.outputs.zip_sha }}
        run: |
          EXISTING_BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          export EXISTING_BODY
          python3 - <<'PY' > /tmp/release-notes.md
          import os, re

          ver = os.environ["VERSION"]
          mac_built = os.environ["MAC_BUILT"] == "true"
          win_built = os.environ["WIN_BUILT"] == "true"
          pkg_sha = os.environ.get("PKG_SHA", "")
          dmg_sha = os.environ.get("DMG_SHA", "")
          exe_sha = os.environ.get("EXE_SHA", "")
          zip_sha = os.environ.get("ZIP_SHA", "")
          existing = os.environ.get("EXISTING_BODY", "").strip()

          mac_section = (
              "### macOS (Apple Silicon)\n"
              "- 支持 Apple 芯片（M 系列）Mac，macOS 12 或更高版本。\n"
              f"- 首次安装请下载 `vRemoter-Community-{ver}-AppleSilicon.pkg`（包含 App 与 `vRemoteDriver.driver` 音频驱动）；仅升级 App 可下载 `.dmg`。\n"
              "- 安装包未签名，如被系统拦截请到 **系统设置 → 隐私与安全性 → 仍要打开**。"
          )
          win_section = (
              "### Windows 10 / 11 (x64)\n"
              f"- 支持 Windows 10 (1809+) 与 Windows 11，推荐下载 `vRemoter-Community-{ver}-Windows-x64-Setup.exe`（便携免安装版为 `.zip`）。\n"
              "- 首次使用需在主界面引导中一键安装 WHQL 签名虚拟声卡 **VB-Cable**。"
          )

          if mac_built and win_built and "## 安装说明" not in existing:
              header = (
                  "## 安装说明\n\n"
                  f"{mac_section}\n\n"
                  f"{win_section}\n\n"
                  "### SHA-256\n"
                  f"- `vRemoter-Community-{ver}-AppleSilicon.pkg`: `{pkg_sha}`\n"
                  f"- `vRemoter-Community-{ver}-AppleSilicon.dmg`: `{dmg_sha}`\n"
                  f"- `vRemoter-Community-{ver}-Windows-x64-Setup.exe`: `{exe_sha}`\n"
                  f"- `vRemoter-Community-{ver}-Windows-x64-Portable.zip`: `{zip_sha}`"
              )
              print(header + ("\n\n" + existing if existing else ""))
          elif existing:
              body = existing
              if "## 安装说明" not in body:
                  sections = ["## 安装说明\n"]
                  if mac_built:
                      sections.append(mac_section + "\n")
                  if win_built:
                      sections.append(win_section + "\n")
                  sections.append("### SHA-256")
                  body = "\n".join(sections) + "\n\n" + body
              if win_built:
                  if "### Windows 10 / 11 (x64)" not in body:
                      if "### SHA-256" in body:
                          body = body.replace("### SHA-256", win_section + "\n\n### SHA-256", 1)
                      else:
                          body = body + "\n\n" + win_section
                  for fname, sha in [
                      (f"vRemoter-Community-{ver}-Windows-x64-Setup.exe", exe_sha),
                      (f"vRemoter-Community-{ver}-Windows-x64-Portable.zip", zip_sha),
                  ]:
                      pattern = rf"^- `{re.escape(fname)}`: `[^`]*`$"
                      line = f"- `{fname}`: `{sha}`"
                      if re.search(pattern, body, flags=re.M):
                          body = re.sub(pattern, line, body, flags=re.M)
                      else:
                          body = body.rstrip() + "\n" + line
              if mac_built:
                  for fname, sha in [
                      (f"vRemoter-Community-{ver}-AppleSilicon.pkg", pkg_sha),
                      (f"vRemoter-Community-{ver}-AppleSilicon.dmg", dmg_sha),
                  ]:
                      pattern = rf"^- `{re.escape(fname)}`: `[^`]*`$"
                      line = f"- `{fname}`: `{sha}`"
                      if re.search(pattern, body, flags=re.M):
                          body = re.sub(pattern, line, body, flags=re.M)
                      else:
                          body = body.rstrip() + "\n" + line
              print(body)
          else:
              print("## 安装说明\n")
              if mac_built:
                  print(mac_section + "\n")
              if win_built:
                  print(win_section + "\n")
              print("### SHA-256")
              if mac_built:
                  print(f"- `vRemoter-Community-{ver}-AppleSilicon.pkg`: `{pkg_sha}`")
                  print(f"- `vRemoter-Community-{ver}-AppleSilicon.dmg`: `{dmg_sha}`")
              if win_built:
                  print(f"- `vRemoter-Community-{ver}-Windows-x64-Setup.exe`: `{exe_sha}`")
                  print(f"- `vRemoter-Community-{ver}-Windows-x64-Portable.zip`: `{zip_sha}`")
          PY

          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "vRemoter ${VERSION}" \
            --notes-file /tmp/release-notes.md
