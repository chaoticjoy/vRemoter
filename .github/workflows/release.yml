name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0); defaults to v<VERSION>'
        required: false

permissions:
  contents: write

env:
  UPSTREAM_PKG_URL: https://github.com/ccc333cn/vRemoter/releases/download/v1.3.2/vRemoter-Community-1.3.2-AppleSilicon.pkg
  UPSTREAM_PKG_SHA256: a86115de7f9a1fcc262f51dd494b80a5f660661c1d01afc6b6ad5ba488e09445

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run Self-Tests
        run: |
          swift build --disable-sandbox
          .build/debug/vRemote --voice-session-self-test
          Scripts/run-self-tests.sh

      - name: Resolve Version & Tag
        id: meta
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Packaging/Info.plist)
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${PLIST_VERSION}"
          fi
          echo "version=${PLIST_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare vRemoteDriver.driver from Upstream v1.3.2 PKG
        run: |
          curl -fsSL "$UPSTREAM_PKG_URL" -o /tmp/upstream.pkg
          echo "$UPSTREAM_PKG_SHA256  /tmp/upstream.pkg" | shasum -a 256 -c -
          rm -rf /tmp/upstream-expanded
          pkgutil --expand-full /tmp/upstream.pkg /tmp/upstream-expanded
          test -d "/tmp/upstream-expanded/Payload/Library/Audio/Plug-Ins/HAL/vRemoteDriver.driver"

      - name: Build PKG and DMG
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          export VREMOTER_DRIVER="/tmp/upstream-expanded/Payload/Library/Audio/Plug-Ins/HAL/vRemoteDriver.driver"
          Scripts/build-pkg.sh
          Scripts/build-dmg.sh

          PKG_OUT="dist/vRemoter-Community-${VERSION}-AppleSilicon.pkg"
          DMG_OUT="dist/vRemoter-Community-${VERSION}-AppleSilicon.dmg"
          cp "dist/vRemoter-${VERSION}.pkg" "$PKG_OUT"
          cp "dist/vRemoter-${VERSION}.dmg" "$DMG_OUT"

          PKG_SHA=$(shasum -a 256 "$PKG_OUT" | awk '{print $1}')
          DMG_SHA=$(shasum -a 256 "$DMG_OUT" | awk '{print $1}')
          {
            echo "## 安装说明"
            echo ""
            echo "- 支持 Apple 芯片（M 系列）Mac，macOS 12 或更高版本。"
            echo "- 首次安装请下载 \`vRemoter-Community-${VERSION}-AppleSilicon.pkg\`（包含 App 与 \`vRemoteDriver.driver\` 音频驱动）；仅升级 App 可下载 \`.dmg\`。"
            echo "- 安装包未签名，如被系统拦截请到 **系统设置 → 隐私与安全性 → 仍要打开**。"
            echo ""
            echo "### SHA-256"
            echo "- \`vRemoter-Community-${VERSION}-AppleSilicon.pkg\`: \`${PKG_SHA}\`"
            echo "- \`vRemoter-Community-${VERSION}-AppleSilicon.dmg\`: \`${DMG_SHA}\`"
          } > /tmp/release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: vRemoter ${{ steps.meta.outputs.version }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
          files: |
            dist/vRemoter-Community-${{ steps.meta.outputs.version }}-AppleSilicon.pkg
            dist/vRemoter-Community-${{ steps.meta.outputs.version }}-AppleSilicon.dmg
